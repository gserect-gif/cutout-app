[package]
name = "bgremover"
version = "0.1.0"
description = "Local, offline background removal utility"
edition = "2021"
rust-version = "1.77"

[lib]
name = "bgremover_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Image decoding/encoding (PNG, JPEG, WebP) and resizing
image = { version = "0.25", features = ["png", "jpeg", "webp"] }

# ONNX Runtime inference
ort = { version = "2.0.0-rc.13" }

# Used only for lightweight, direct Windows process-memory instrumentation
# ([perf] logging) during the current investigation into RAM usage across
# repeated inferences — not a general-purpose dependency.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
