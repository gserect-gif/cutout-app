[package]
name = "bgremover"
version = "2.1.0"
description = "Local, offline background removal utility"
edition = "2021"
rust-version = "1.77"

[lib]
name = "bgremover_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Remembers the window's size and position between launches.
tauri-plugin-window-state = "2"
# Lets the finished image be dragged out of the window into other apps.
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Image decoding/encoding (PNG, JPEG, WebP) and resizing
image = { version = "0.25", features = ["png", "jpeg", "webp"] }

# ONNX Runtime inference
ort = { version = "2.0.0-rc.13" }

# Update check (Settings > Check for updates). It only connects to GitHub when
# that button is clicked; Cutout never connects by itself.
ureq = "3"

# GPU acceleration: each OS gets its own provider, which makes the build link a
# ONNX Runtime that includes it. If the GPU can't be used when the app runs,
# Cutout falls back to the CPU on its own. Linux has none in this version: a
# WebGPU build broke the AppImage packaging.
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["directml"] }
# Lists the graphics adapters so Auto GPU mode can tell a dedicated card from integrated graphics.
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["coreml"] }

# Used only for lightweight, direct Windows process-memory instrumentation
# ([perf] logging) during the current investigation into RAM usage across
# repeated inferences — not a general-purpose dependency.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Keeps debug builds small. Full debug info is what makes the build folder
# balloon to many GB, and Cutout doesn't need a debugger attached.
[profile.dev]
debug = 0
incremental = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
