name: Build installers

# Builds Cutout for Windows, macOS (Apple Silicon) and Linux (x86_64).
#
# - Run it by hand: GitHub > Actions > "Build installers" > Run workflow.
#   The installers show up as downloadable artifacts on the run page.
# - Push a tag like v0.1.0 to also create a DRAFT GitHub Release with the
#   installers attached.
#
# macOS on Intel is not built: the prebuilt ONNX Runtime that the `ort` crate
# downloads has no Intel-Mac version.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: "--bundles nsis --config src-tauri/tauri.directml.conf.json"
            artifact: "src-tauri/target/release/bundle/nsis/*.exe"
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: "--bundles dmg"
            artifact: "src-tauri/target/release/bundle/dmg/*.dmg"
          - name: Linux
            os: ubuntu-24.04
            args: "--bundles deb,appimage"
            artifact: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # The AI models are not stored in git, so download them here. They are
      # cached between runs so this only happens once per OS.
      - name: Cache AI models
        id: models-cache
        uses: actions/cache@v4
        with:
          path: models
          key: models-v1-${{ runner.os }}

      - name: Download AI models
        if: steps.models-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          get() { curl -L --fail --retry 3 --retry-delay 5 -o "models/$1" "$2"; }
          get model.onnx "https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/main/onnx/model.onnx"
          get model_fp16.onnx "https://huggingface.co/onnx-community/BiRefNet-ONNX/resolve/main/onnx/model_fp16.onnx"
          get isnet-general-use.onnx "https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx"
          get u2netp.onnx "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx"

      - name: Check AI models
        shell: bash
        run: |
          set -euo pipefail
          for f in model.onnx model_fp16.onnx isnet-general-use.onnx u2netp.onnx; do
            size=$(wc -c < "models/$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "models/$f is missing or too small, the download probably failed" >&2
              exit 1
            fi
          done

      - name: Install npm packages
        run: npm ci

      # GPU acceleration on Windows (DirectML) needs DirectML.dll next to the
      # app. Download Microsoft's official copy and tell the installer build
      # to include it. (Compiling the app once first to pick up the copy that
      # the build makes failed: the second compile overwrote the first one's
      # files while Windows still had them open.) If the download fails, the
      # installer is built without the file (the app then uses the DLL that
      # ships with Windows, or the CPU) and this step prints a warning.
      - name: Get DirectML.dll for the installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $config = '{}'
          try {
            Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4" -OutFile "$env:RUNNER_TEMP\dml.zip"
            Expand-Archive -Path "$env:RUNNER_TEMP\dml.zip" -DestinationPath "$env:RUNNER_TEMP\dml" -Force
            Copy-Item "$env:RUNNER_TEMP\dml\bin\x64-win\DirectML.dll" "src-tauri\DirectML.dll" -ErrorAction Stop
            Get-Item "src-tauri\DirectML.dll" | Format-List Name, Length
            $config = '{"bundle":{"resources":{"DirectML.dll":"DirectML.dll"}}}'
          } catch {
            Write-Host "::warning::Could not get DirectML.dll ($_). The installer is built without it."
          }
          Set-Content -Path "src-tauri\tauri.directml.conf.json" -Value $config -Encoding ascii
          Get-Content "src-tauri\tauri.directml.conf.json"

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Cutout ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}

      # The Linux GPU runtime must be built into the app. If the build left
      # extra shared libraries beside it, the installer would not contain them
      # and the app would fail to start, so stop here instead of shipping that.
      - name: Check the Linux build has no loose libraries
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          ls -l src-tauri/target/release/ | head -50
          extra=$(ls src-tauri/target/release/*.so* 2>/dev/null | grep -v bgremover_lib || true)
          if [ -n "$extra" ]; then
            echo "The build produced shared libraries the installer does not include:" >&2
            echo "$extra" >&2
            exit 1
          fi

      # The AppImage catalog's test bot found the Linux AppImage can't start
      # for other users: some files inside it lack read/execute permission for
      # anyone but the build user. Unpack it, fix the permissions, and pack it
      # again. If this step fails the job turns red on purpose, so a broken
      # repack is visible instead of silently shipping the original file.
      #
      # The same step also removes the bundled libwayland-* libraries. They
      # come from Ubuntu 24.04 and don't work with the newer Mesa on distros
      # like Fedora: the window stays blank and the log shows "Could not create
      # default EGL display: EGL_BAD_PARAMETER" (issue #1). Every Linux desktop
      # already has these libraries, so the app uses the system's copy instead.
      - name: Fix AppImage permissions (Linux)
        id: fixappimage
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        working-directory: src-tauri/target/release/bundle/appimage
        run: |
          set -euo pipefail
          APPIMAGE="$(ls *.AppImage | head -n 1)"
          chmod +x "$APPIMAGE"
          "./$APPIMAGE" --appimage-extract > /dev/null
          chmod -R a+rX squashfs-root
          chmod a+x squashfs-root/AppRun
          if [ -f squashfs-root/AppRun.wrapped ]; then chmod a+x squashfs-root/AppRun.wrapped; fi
          if [ -d squashfs-root/usr/bin ]; then find squashfs-root/usr/bin -type f -exec chmod a+x {} +; fi
          rm -fv squashfs-root/usr/lib/libwayland-*
          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          rm "$APPIMAGE"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool
          ls -l

      # Swap the repaired AppImage into the draft release (same file name, so
      # it replaces the one tauri-action uploaded).
      - name: Replace AppImage on the draft release (Linux)
        if: matrix.os == 'ubuntu-24.04' && startsWith(github.ref, 'refs/tags/') && steps.fixappimage.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Cutout-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
