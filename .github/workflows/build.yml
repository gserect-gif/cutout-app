name: Build installers

# Builds Cutout for Windows, macOS (Apple Silicon) and Linux (x86_64).
#
# - Run it by hand: GitHub > Actions > "Build installers" > Run workflow.
#   The installers show up as downloadable artifacts on the run page.
# - Push a tag like v0.1.0 to also create a DRAFT GitHub Release with the
#   installers attached. On Windows that is the Full installer, the Lite
#   installer (Fast model only) and the model files + manifest the Lite
#   installer downloads from.
#
# macOS on Intel is not built: the prebuilt ONNX Runtime that the `ort` crate
# downloads has no Intel-Mac version.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: "--bundles nsis --config src-tauri/tauri.directml.conf.json"
            artifact: "src-tauri/target/release/bundle/nsis/*.exe"
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: "--bundles dmg"
            artifact: "src-tauri/target/release/bundle/dmg/*.dmg"
          - name: Linux
            os: ubuntu-24.04
            args: "--bundles deb,appimage"
            artifact: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # The AI models are not stored in git, so download them here. They are
      # cached between runs so this only happens once per OS.
      - name: Cache AI models
        id: models-cache
        uses: actions/cache@v4
        with:
          path: models
          key: models-v1-${{ runner.os }}

      - name: Download AI models
        if: steps.models-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          get() { curl -L --fail --retry 3 --retry-delay 5 -o "models/$1" "$2"; }
          get model.onnx "https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/main/onnx/model.onnx"
          get model_fp16.onnx "https://huggingface.co/onnx-community/BiRefNet-ONNX/resolve/main/onnx/model_fp16.onnx"
          get isnet-general-use.onnx "https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx"
          get u2netp.onnx "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx"

      - name: Check AI models
        shell: bash
        run: |
          set -euo pipefail
          for f in model.onnx model_fp16.onnx isnet-general-use.onnx u2netp.onnx; do
            size=$(wc -c < "models/$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "models/$f is missing or too small, the download probably failed" >&2
              exit 1
            fi
          done

      - name: Install npm packages
        run: npm ci

      # GPU acceleration on Windows (DirectML) needs DirectML.dll next to the
      # app. Download Microsoft's official copy and tell the installer build
      # to include it. (Compiling the app once first to pick up the copy that
      # the build makes failed: the second compile overwrote the first one's
      # files while Windows still had them open.) If the download fails, the
      # installer is built without the file (the app then uses the DLL that
      # ships with Windows, or the CPU) and this step prints a warning.
      - name: Get DirectML.dll for the installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $config = '{}'
          try {
            Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4" -OutFile "$env:RUNNER_TEMP\dml.zip"
            Expand-Archive -Path "$env:RUNNER_TEMP\dml.zip" -DestinationPath "$env:RUNNER_TEMP\dml" -Force
            Copy-Item "$env:RUNNER_TEMP\dml\bin\x64-win\DirectML.dll" "src-tauri\DirectML.dll" -ErrorAction Stop
            Get-Item "src-tauri\DirectML.dll" | Format-List Name, Length
            $config = '{"bundle":{"resources":{"DirectML.dll":"DirectML.dll"}}}'
          } catch {
            Write-Host "::warning::Could not get DirectML.dll ($_). The installer is built without it."
          }
          Set-Content -Path "src-tauri\tauri.directml.conf.json" -Value $config -Encoding ascii
          Get-Content "src-tauri\tauri.directml.conf.json"

      # ort-sys 2.0.0-rc.13 has a bug with newer Cargo versions: its build script
      # puts its libraries into "examples" and "deps" folders next to Cargo's
      # build folder, but assumes they already exist. On a fresh CI runner they
      # don't, and the build crashes with "NotFound" in dynamic_link.rs. Creating
      # the folders first avoids that. (Harmless when they already exist.)
      - name: Create folders the ort-sys build script expects
        shell: bash
        run: mkdir -p src-tauri/target/release/build/examples src-tauri/target/release/build/deps

      # ---- Linux build ----
      # Linux GPU (WebGPU) links a separate shared library, libwebgpu_dawn.so. It
      # has to be inside both the .deb and the AppImage, or the app would not
      # start. So Linux is built in three steps instead of one: build the app,
      # copy the library to a folder of our own, then package with that folder on
      # LD_LIBRARY_PATH (so the AppImage tool finds the library and bundles it)
      # and the library listed in the .deb's files. build.rs makes the app look
      # in ../lib next to its binary, which is /usr/lib for the .deb and usr/lib
      # inside the AppImage.
      - name: Build the app (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: npm run tauri build -- --no-bundle

      - name: Collect the WebGPU library (Linux)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/gpu-libs
          LIB="$(find src-tauri/target/release/build -maxdepth 1 -name 'libwebgpu_dawn.so*' 2>/dev/null | head -n 1 || true)"
          if [ -z "$LIB" ]; then
            LIB="$(find "$HOME/.cache/ort.pyke.io" -name 'libwebgpu_dawn.so*' 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$LIB" ]; then
            echo "libwebgpu_dawn.so was not found after the build" >&2
            exit 1
          fi
          cp -L "$LIB" src-tauri/gpu-libs/libwebgpu_dawn.so
          ls -l src-tauri/gpu-libs
          size=$(wc -c < src-tauri/gpu-libs/libwebgpu_dawn.so)
          if [ "$size" -lt 1000000 ]; then
            echo "libwebgpu_dawn.so is too small ($size bytes)" >&2
            exit 1
          fi
          # What the app asks the system for. The library's file name must match.
          readelf -d src-tauri/target/release/bgremover | grep -E 'NEEDED|RPATH|RUNPATH' || true

      - name: Package the Linux installers
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          DAWN="$PWD/src-tauri/gpu-libs/libwebgpu_dawn.so"
          printf '{"bundle":{"linux":{"deb":{"files":{"/usr/lib/libwebgpu_dawn.so":"%s"}}}}}' "$DAWN" > src-tauri/tauri.linux-gpu.conf.json
          cat src-tauri/tauri.linux-gpu.conf.json
          LD_LIBRARY_PATH="$PWD/src-tauri/gpu-libs:${LD_LIBRARY_PATH:-}" \
            npm run tauri bundle -- --bundles deb,appimage --config src-tauri/tauri.linux-gpu.conf.json

      - name: Build
        if: matrix.os != 'ubuntu-24.04'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Cutout ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}

      # ---- Lite installer (Windows) ----
      # The Lite installer is the same app with only the Fast model inside; the
      # other models are downloaded from this release when the user asks (see
      # models_dl.rs). It is built second, from a config that removes the three
      # big models from the installer's resources. It has its own file name, and
      # the Full installer is copied aside first and put back afterwards, because
      # both builds write the same file name. If the Lite build fails, this job
      # still ships the Full installer (continue-on-error) and prints why.
      - name: Build the Lite installer (Windows)
        id: lite
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = "src-tauri/target/release/bundle/nsis"
          $full = Get-ChildItem "$nsis/*.exe" | Select-Object -First 1
          $keep = Join-Path $env:RUNNER_TEMP "full-installer"
          New-Item -ItemType Directory -Force -Path $keep | Out-Null
          Copy-Item $full.FullName $keep

          # Same config as the Full build (DirectML.dll), plus: remove the three
          # big models. A null value deletes a key when configs are merged.
          $conf = Get-Content "src-tauri/tauri.directml.conf.json" -Raw | ConvertFrom-Json -AsHashtable
          if (-not $conf.ContainsKey('bundle')) { $conf['bundle'] = @{} }
          if (-not $conf['bundle'].ContainsKey('resources')) { $conf['bundle']['resources'] = @{} }
          foreach ($m in 'model.onnx', 'model_fp16.onnx', 'isnet-general-use.onnx') {
            $conf['bundle']['resources']["../models/$m"] = $null
          }
          $conf | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.lite.conf.json" -Encoding ascii
          Get-Content "src-tauri/tauri.lite.conf.json"

          npx tauri build --bundles nsis --config src-tauri/tauri.lite.conf.json
          if ($LASTEXITCODE -ne 0) { throw "The Lite build failed." }

          $built = Get-ChildItem "$nsis/*.exe" | Where-Object { $_.Name -eq $full.Name } | Select-Object -First 1
          if (-not $built) { throw "The Lite installer was not found." }
          # The Lite file must be far smaller. If it isn't, the models were not removed.
          if ($built.Length -gt ($full.Length * 0.5)) {
            throw "The Lite installer is as big as the Full one ($($built.Length) bytes), so the models were not removed."
          }
          $liteName = $full.Name -replace '-setup\.exe$', '-lite-setup.exe'
          Move-Item $built.FullName (Join-Path $nsis $liteName) -Force
          Write-Host "Lite installer: $liteName ($([math]::Round((Get-Item (Join-Path $nsis $liteName)).Length / 1MB)) MB)"

      - name: Put the Full installer back (Windows)
        if: always() && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $nsis = "src-tauri/target/release/bundle/nsis"
          $keep = Join-Path $env:RUNNER_TEMP "full-installer"
          if (Test-Path $keep) { Copy-Item "$keep/*" $nsis -Force }
          Get-ChildItem "$nsis/*.exe" | Format-Table Name, Length

      - name: Add the Lite installer to the draft release (Windows)
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/') && steps.lite.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/release/bundle/nsis/*-lite-setup.exe

      # The Lite installer downloads Balanced, Best and Best+ from this release.
      # Publish them under clear names, with a manifest that lists each file's
      # size and SHA-256 (the app checks the download against it).
      - name: Publish the model files and manifest (Windows)
        id: modelassets
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "model-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $map = @(
            @{ key = 'fast';      file = 'u2netp.onnx' },
            @{ key = 'balanced';  file = 'isnet-general-use.onnx' },
            @{ key = 'best';      file = 'model.onnx' },
            @{ key = 'best-plus'; file = 'model_fp16.onnx' }
          )
          $entries = @()
          foreach ($m in $map) {
            $asset = "cutout-model-$($m.key).onnx"
            Copy-Item "models/$($m.file)" "$out/$asset"
            $item = Get-Item "$out/$asset"
            $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLower()
            $entries += [ordered]@{ key = $m.key; asset = $asset; size = $item.Length; sha256 = $hash }
          }
          @{ models = $entries } | ConvertTo-Json -Depth 5 | Set-Content "$out/models-manifest.json" -Encoding ascii
          Get-Content "$out/models-manifest.json"

      - name: Attach the model files to the draft release (Windows)
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/') && steps.modelassets.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: model-assets/*

      # Check the Linux packages really contain the WebGPU library. Without it
      # the app would not start, so fail here instead of shipping that.
      - name: Check the .deb contains the WebGPU library (Linux)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          ls -l src-tauri/target/release/bundle/deb src-tauri/target/release/bundle/appimage
          deb="$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)"
          dpkg-deb -c "$deb" | grep 'libwebgpu_dawn' || { echo "libwebgpu_dawn.so is missing from the .deb" >&2; exit 1; }

      # The AppImage catalog's test bot found the Linux AppImage can't start
      # for other users: some files inside it lack read/execute permission for
      # anyone but the build user. Unpack it, fix the permissions, and pack it
      # again. If this step fails the job turns red on purpose, so a broken
      # repack is visible instead of silently shipping the original file.
      - name: Fix AppImage permissions (Linux)
        id: fixappimage
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        working-directory: src-tauri/target/release/bundle/appimage
        run: |
          set -euo pipefail
          APPIMAGE="$(ls *.AppImage | head -n 1)"
          chmod +x "$APPIMAGE"
          "./$APPIMAGE" --appimage-extract > /dev/null
          # The WebGPU library must be inside the AppImage. The packaging step
          # normally puts it there; add it here if it is missing.
          mkdir -p squashfs-root/usr/lib
          if [ ! -f squashfs-root/usr/lib/libwebgpu_dawn.so ]; then
            cp -L "$GITHUB_WORKSPACE/src-tauri/gpu-libs/libwebgpu_dawn.so" squashfs-root/usr/lib/libwebgpu_dawn.so
          fi
          chmod -R a+rX squashfs-root
          chmod a+x squashfs-root/AppRun
          if [ -f squashfs-root/AppRun.wrapped ]; then chmod a+x squashfs-root/AppRun.wrapped; fi
          if [ -d squashfs-root/usr/bin ]; then find squashfs-root/usr/bin -type f -exec chmod a+x {} +; fi
          # Remove the bundled libwayland libraries (client, egl, cursor, server).
          # They come from the Ubuntu build runner and clash with the newer Mesa
          # on current distros, so WebKit can't create its EGL display and the
          # window stays blank (issue #1). The app then uses the system's copies.
          # Found and fixed by Voicedrew11 (pull request #2).
          find squashfs-root/usr/lib -maxdepth 1 -name 'libwayland-*' -print -delete
          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          rm "$APPIMAGE"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool
          ls -l

      # Check the repaired AppImage really contains the WebGPU library.
      - name: Check the AppImage contains the WebGPU library (Linux)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        working-directory: src-tauri/target/release/bundle/appimage
        run: |
          set -euo pipefail
          APPIMAGE="$(ls *.AppImage | head -n 1)"
          chmod +x "$APPIMAGE"
          "./$APPIMAGE" --appimage-extract 'usr/lib/libwebgpu_dawn.so' > /dev/null
          test -s squashfs-root/usr/lib/libwebgpu_dawn.so
          ls -l squashfs-root/usr/lib/libwebgpu_dawn.so
          rm -rf squashfs-root

      # Linux isn't built by tauri-action (see "Build the app (Linux)"), so add
      # the .deb and the repaired AppImage to the draft release here.
      - name: Add the Linux installers to the draft release
        if: matrix.os == 'ubuntu-24.04' && startsWith(github.ref, 'refs/tags/') && steps.fixappimage.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cutout ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Cutout-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
